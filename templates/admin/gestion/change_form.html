{% extends "admin/change_form.html" %}
{% block footer %}
{{ block.super }}

<script>
(function() {
    console.log("🚀 [AUTOFILL] Script inyectado y ejecutándose en Django Admin...");

    function initAutofill() {
        // Selector flexible para capturar el campo requerimiento
        var selects = document.querySelectorAll("select");
        var reqSelect = null;

        selects.forEach(function(s) {
            if (s.name && (s.name.includes("requerimiento") or s.id.includes("requerimiento"))) {
                reqSelect = s;
            }
        });

        if (!reqSelect) {
            reqSelect = document.querySelector("#id_requerimiento_en_curso") || document.querySelector("select[name='requerimiento_en_curso']");
        }

        if (!reqSelect) {
            console.warn("⚠️ [AUTOFILL] No se encontró el selector de Requerimiento.");
            return;
        }

        console.log("✅ [AUTOFILL] Selector encontrado:", reqSelect.name || reqSelect.id);

        function fillFields(data) {
            console.log("📦 [AUTOFILL] Aplicando datos al formulario:", data);

            // Mapeo flexible de inputs y textareas
            var fields = {
                persona: document.querySelector("#id_persona_solicito") || document.querySelector("input[name='persona_solicito']"),
                ticket: document.querySelector("#id_numero_ticket") || document.querySelector("input[name='numero_ticket']"),
                titulo: document.querySelector("#id_titulo") || document.querySelector("input[name='titulo']"),
                empresa: document.querySelector("#id_empresa") || document.querySelector("select[name='empresa']"),
                fecha: document.querySelector("#id_fecha_solicitud") || document.querySelector("input[name='fecha_solicitud']"),
                desglose: document.querySelector("#id_desglose") || document.querySelector("textarea[name='desglose']")
            };

            if (fields.persona && (data.solicitante || data.persona_solicito || data.usuario)) {
                fields.persona.value = data.solicitante || data.persona_solicito || data.usuario;
            }
            if (fields.ticket && (data.numero_ticket || data.ticket || data.id)) {
                fields.ticket.value = data.numero_ticket || data.ticket || ("REQ-" + String(data.id).padStart(4, '0'));
            }
            if (fields.titulo && data.titulo) {
                fields.titulo.value = data.titulo;
            }
            if (fields.fecha && (data.fecha || data.fecha_creacion)) {
                var f = data.fecha || data.fecha_creacion;
                fields.fecha.value = f.split("T")[0];
            }
            if (fields.desglose && (data.desglose || data.materiales || data.descripcion)) {
                fields.desglose.value = data.desglose || data.materiales || data.descripcion;
            }
            if (fields.empresa && (data.empresa_id || data.empresa)) {
                fields.empresa.value = data.empresa_id || data.empresa;
            }
        }

        function fetchReqData() {
            var val = reqSelect.value;
            if (!val) return;
            
            console.log("🔄 [AUTOFILL] Solicitando datos a API para ID:", val);

            fetch("/api/requerimiento/" + val + "/")
                .then(r => r.json())
                .then(data => fillFields(data))
                .catch(err => console.error("❌ [AUTOFILL] Error llamando a la API:", err));
        }

        reqSelect.addEventListener("change", fetchReqData);

        if (reqSelect.value) {
            fetchReqData();
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initAutofill);
    } else {
        initAutofill();
    }
})();
</script>

{% endblock %}
